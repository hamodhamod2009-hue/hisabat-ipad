<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حساباتي</title><meta name="theme-color" content="#12345b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="حساباتي"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#12345b;color:white;padding:20px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:24px}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px #17345612;margin-bottom:14px}.big{padding:32px;text-align:center;cursor:pointer;border:2px solid #dce6f2}.big h2{margin:8px}button{border:0;background:#1767b2;color:white;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}button.secondary{background:#e7eef7;color:#173456}button.danger{background:#b73545}button:disabled{opacity:.4}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input{flex:1;min-width:180px}input,select,textarea{width:100%;padding:12px;border:1px solid #cdd9e7;border-radius:10px;font-size:16px;background:white}label{display:block;font-weight:600;margin:10px 0 5px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.muted{color:#65758a}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#f0f5fc;border-radius:12px;padding:14px}.stat strong{display:block;font-size:22px;margin-top:7px;overflow-wrap:anywhere}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #edf0f5;padding:13px 0}.item:last-child{border:0}.item button{flex-shrink:0}.positive{color:#a44818}.negative{color:#126a4e}.neutral{color:#526173}table{width:100%;border-collapse:collapse;min-width:650px}td,th{padding:11px;text-align:right;border-bottom:1px solid #e5eaf1;vertical-align:top}th{background:#f2f6fc}.scroll{overflow:auto}dialog{border:0;border-radius:16px;max-width:min(94vw,650px);width:100%;padding:20px;box-shadow:0 15px 80px #0004}dialog::backdrop{background:#15243b8a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.small{padding:7px 10px;font-size:13px}.notice{background:#fff4df;border-radius:12px;padding:12px;color:#73511b;font-size:14px;margin-bottom:14px}@media print{header,.toolbar,.actions,.no-print,button,.notice{display:none!important}body{background:white}main{max-width:none}.card{box-shadow:none;border:1px solid #ddd}dialog{display:none!important}table{min-width:0}th,td{font-size:11px}}</style></head><body><header><h1>حساباتي</h1><span id="topTitle">الرئيسية</span></header><main id="app"></main><dialog id="dlg"><div id="dlgBody"></div></dialog><script>
const KEY='hisabat_ipad_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{customers:[],entries:[]}}catch{db={customers:[],entries:[]}};let section=null,customer=null,filterFrom='',filterTo='';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random();const money=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذر حفظ البيانات على الجهاز. لا تضف عمليات جديدة قبل حل المشكلة.')}}function entries(id){return db.entries.filter(x=>x.customerId===id)}function totals(id){let a=0,b=0,qty=0;for(const x of entries(id)){if(x.kind==='receive'){a+=x.amount;qty+=x.qty||0}else b+=x.amount}return {a,b,qty,net:a-b}}function status(c){let t=totals(c.id);if(Math.abs(t.net)<.000001)return 'الحساب مصفّى';if(c.section==='cash')return t.net>0?'الزبون يطلبك':'إنت تطلب الزبون';return t.net>0?'المتبقي عليك للزبون':'رصيد إلك عند الزبون'}function close(){ $('dlg').close() }function modal(html){$('dlgBody').innerHTML=html;$('dlg').showModal()}function goHome(){section=null;customer=null;render()}function goSection(s){section=s;customer=null;render()}function goCustomer(id){customer=id;filterFrom='';filterTo='';render()}function render(){const root=$('app');$('topTitle').textContent=customer?'كشف حساب':section==='cash'?'الأكاونت والكاش':section==='goods'?'البضاعة والتسديد':'الرئيسية';if(!section){root.innerHTML=`<div class="notice">البيانات محفوظة على هذا الآيباد داخل المتصفح فقط. لا تمسح بيانات Safari أو تستخدم التصفح الخاص. النسخ الاحتياطي والمزامنة غير مفعّلين بعد.</div><div class="grid"><div class="card big" onclick="goSection('cash')"><h2>💵 الأكاونت والكاش</h2><p>استلام أكاونت وتسليم كاش</p></div><div class="card big" onclick="goSection('goods')"><h2>📦 البضاعة والتسديد</h2><p>استلام بضاعة وتسديد دفعات</p></div></div>`;return}if(!customer){root.innerHTML=`<div class="toolbar"><button class="secondary" onclick="goHome()">الرئيسية</button><input id="search" placeholder="بحث باسم الزبون" oninput="renderList()"><button onclick="addCustomer()">+ إضافة زبون</button></div><div class="card" id="list"></div>`;renderList();return}const c=db.customers.find(x=>x.id===customer);if(!c){customer=null;render();return}let t=totals(c.id);root.innerHTML=`<div class="toolbar no-print"><button class="secondary" onclick="goSection(section)">رجوع للزبائن</button><button onclick="addEntry('receive')">+ ${section==='cash'?'استلام أكاونت':'استلام بضاعة'}</button><button onclick="addEntry('pay')">+ ${section==='cash'?'تسليم كاش':'دفعة جديدة'}</button><button class="secondary" onclick="window.print()">طباعة / PDF</button><button class="secondary" onclick="editCustomer()">تعديل الاسم</button></div><div class="card"><h2>كشف حساب: ${esc(c.name)}</h2><p class="muted">${section==='cash'?'الأكاونت والكاش':'البضاعة والتسديد'}</p><div class="stats"><div class="stat">${section==='cash'?'إجمالي الأكاونت المستلم':'إجمالي قيمة البضاعة'}<strong>${money(t.a)}</strong></div><div class="stat">${section==='cash'?'إجمالي الكاش المسلّم':'إجمالي التسديدات'}<strong>${money(t.b)}</strong></div>${section==='goods'?`<div class="stat">مجموع الكميات<strong>${money(t.qty)}</strong></div>`:''}<div class="stat">${status(c)}<strong class="${t.net>0?'positive':t.net<0?'negative':'neutral'}">${money(Math.abs(t.net))}</strong></div></div></div><div class="card"><div class="toolbar no-print"><label>من تاريخ <input id="from" type="date" value="${filterFrom}" onchange="filterFrom=this.value;renderRows()"></label><label>إلى تاريخ <input id="to" type="date" value="${filterTo}" onchange="filterTo=this.value;renderRows()"></label><button class="secondary" onclick="filterFrom='';filterTo='';render()">مسح الفلتر</button></div><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الحركة</th><th>التفاصيل</th><th>المبلغ</th><th>الرصيد بعد الحركة</th><th class="no-print">إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;renderRows()}
function renderList(){let q=($('search')?.value||'').trim().toLowerCase();let cs=db.customers.filter(c=>c.section===section&&c.name.toLowerCase().includes(q));$('list').innerHTML=cs.length?cs.map(c=>{let t=totals(c.id);return `<div class="item"><div><b>${esc(c.name)}</b><div class="muted">${status(c)}: ${money(Math.abs(t.net))}</div></div><button onclick="goCustomer('${c.id}')">كشف حساب</button></div>`}).join(''):'<p class="muted">لا يوجد زبائن. اضغط إضافة زبون.</p>'}
function addCustomer(){modal(`<h2>إضافة زبون</h2><form id="f" onsubmit="event.preventDefault();let name=this.name.value.trim();if(!name)return;db.customers.push({id:uid(),section,name});save();close();render()"><label>اسم الزبون</label><input name="name" required maxlength="120" autofocus><div class="actions"><button type="submit">حفظ</button><button type="button" class="secondary" onclick="close()">إلغاء</button></div></form>`)}function editCustomer(){let c=db.customers.find(x=>x.id===customer);modal(`<h2>تعديل اسم الزبون</h2><form onsubmit="event.preventDefault();let name=this.name.value.trim();if(!name)return;db.customers.find(x=>x.id===customer).name=name;save();close();render()"><input name="name" value="${esc(c.name)}" required><div class="actions"><button>حفظ</button><button type="button" class="secondary" onclick="close()">إلغاء</button></div></form>`)}
function addEntry(kind,id){let old=id?db.entries.find(x=>x.id===id):null;kind=old?.kind||kind;let goods=section==='goods'&&kind==='receive';let title=section==='cash'?(kind==='receive'?'استلام أكاونت':'تسليم كاش'):(kind==='receive'?'استلام بضاعة':'دفعة جديدة');modal(`<h2>${old?'تعديل':'إضافة'}: ${title}</h2><form id="entryForm" onsubmit="submitEntry(event,'${kind}','${id||''}')"><div class="fields"><div><label>التاريخ</label><input type="date" name="date" required value="${old?.date||today()}"></div>${goods?`<div><label>اسم البضاعة</label><input name="item" required value="${esc(old?.item||'')}"></div><div><label>سعر القطعة</label><input name="unit" type="number" step="any" min="0" required value="${old?.unit??''}" oninput="updateAmount()"></div><div><label>الكمية</label><input name="qty" type="number" step="any" min="0.000001" required value="${old?.qty??''}" oninput="updateAmount()"></div><div><label>المجموع</label><input id="calculated" readonly value="${old?money(old.amount):''}"></div>`:`<div><label>المبلغ</label><input name="amount" type="number" step="any" min="0.01" required value="${old?.amount??''}"></div>`}${section==='goods'&&kind==='pay'?`<div><label>طريقة التسديد</label><select name="method"><option value="cash" ${old?.method==='cash'?'selected':''}>كاش</option><option value="account" ${old?.method==='account'?'selected':''}>أكاونت</option></select></div>`:''}</div><label>ملاحظة (اختياري)</label><textarea name="note" rows="2">${esc(old?.note||'')}</textarea><div class="actions"><button type="submit">حفظ الحركة</button><button type="button" class="secondary" onclick="close()">إلغاء</button></div></form>`)}function updateAmount(){let f=$('entryForm');$('calculated').value=money(Number(f.unit.value)*Number(f.qty.value))}function submitEntry(e,kind,id){e.preventDefault();let f=e.target;let goods=section==='goods'&&kind==='receive';let unit=goods?Number(f.unit.value):0,qty=goods?Number(f.qty.value):0,amount=goods?unit*qty:Number(f.amount.value);if(!Number.isFinite(amount)||amount<=0||goods&&(!Number.isFinite(unit)||!Number.isFinite(qty)||unit<0||qty<=0)){alert('أدخل مبلغ وكمية صحيحين');return}let data={id:id||uid(),customerId:customer,kind,date:f.date.value,amount,unit,qty,item:goods?f.item.value.trim():'',method:section==='goods'&&kind==='pay'?f.method.value:'',note:f.note.value.trim(),createdAt:id?db.entries.find(x=>x.id===id).createdAt:Date.now()};if(goods&&!data.item){alert('اكتب اسم البضاعة');return}if(id){let ix=db.entries.findIndex(x=>x.id===id);db.entries[ix]=data}else db.entries.push(data);save();close();render()}function delEntry(id){if(!confirm('متأكد تريد تحذف هاي الحركة؟ الحذف نهائي.'))return;db.entries=db.entries.filter(x=>x.id!==id);save();render()}function renderRows(){let xs=entries(customer).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);let balance=0;let rows=xs.map(x=>{balance+=x.kind==='receive'?x.amount:-x.amount;return {...x,balance}}).filter(x=>(!filterFrom||x.date>=filterFrom)&&(!filterTo||x.date<=filterTo));$('rows').innerHTML=rows.length?rows.map(x=>{let name=x.kind==='receive'?(section==='cash'?'استلام أكاونت':'استلام بضاعة'):(section==='cash'?'تسليم كاش':'تسديد '+(x.method==='account'?'أكاونت':'كاش'));let details=[x.item,section==='goods'&&x.kind==='receive'?`سعر: ${money(x.unit)} × كمية: ${money(x.qty)}`:'',x.note].filter(Boolean).map(esc).join(' — ');return `<tr><td>${esc(x.date)}</td><td>${name}</td><td>${details||'—'}</td><td>${x.kind==='receive'?'+':'−'} ${money(x.amount)}</td><td>${money(Math.abs(x.balance))} ${x.balance>0?'(عليك)':x.balance<0?'(إلك)':'(مصفّى)'}</td><td class="no-print"><button class="small secondary" onclick="addEntry('${x.kind}','${x.id}')">تعديل</button> <button class="small danger" onclick="delEntry('${x.id}')">حذف</button></td></tr>`}).join(''):'<tr><td colspan="6">لا توجد حركات ضمن الفترة المحددة</td></tr>'}render();</script><script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>

window.close = function() {

  const dialog = document.getElementById('dlg');

  if (dialog) dialog.close();

};

</script>
